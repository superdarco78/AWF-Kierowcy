<!DOCTYPE html>
<html lang="pl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWF KIEROWCY — style i układy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(12px,1.24vh,17px)}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#0d1512;line-height:1.5;
 display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:.9rem;color:#eef5f2;
 -webkit-font-smoothing:antialiased}
#gora{position:sticky;top:.4rem;z-index:90;display:flex;flex-direction:column;gap:.4rem;
 background:rgba(4,26,17,.95);backdrop-filter:blur(14px);padding:.55rem;
 border:1px solid rgba(232,214,176,.3);border-radius:12px;width:min(1480px,100%)}
#gora .rzad{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
#gora .et{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#c9a86e;
 font-weight:600;width:5.5rem;flex:none}
#gora button{min-height:40px;border:1px solid rgba(232,214,176,.28);background:rgba(255,255,255,.06);
 color:#eef5f2;font:600 .8rem/1 inherit;padding:0 .8rem;border-radius:7px;cursor:pointer;
 transition:.14s}
#gora button:hover{background:rgba(255,255,255,.16)}
#gora button.akt{background:#036744;border-color:#c9a86e}
#gora .prawo{margin-left:auto}

/* ================= ZNACZNIKI STYLU (nadpisywane przez klasy s1..s6) ============= */
.okno{--tlo-p:rgba(3,28,18,.52); --tlo-p2:rgba(4,46,30,.68); --ram:rgba(232,214,176,.28);
 --txt:#eef5f2; --txt2:#b7d0c5; --akc:#c9a86e; --przyc:rgba(6,110,74,.62);
 --przyc-h:rgba(8,150,100,.82); --zloty:linear-gradient(180deg,#eddcb4,#b8965a); --zloty-t:#26210f;
 --nag:rgba(3,26,17,.6); --mgla:rgba(2,14,9,0); --blur:15px; --r:12px; --ok:#5fd69a;
 --alm:#ff8d85; --uwg:#f0c069; --lin:rgba(232,214,176,.16);
 width:min(1480px,100%);border-radius:14px;overflow:hidden;position:relative;min-height:41rem;
 border:1px solid var(--ram);box-shadow:0 24px 60px rgba(0,0,0,.6);color:var(--txt)}
/* 2 grafit */
.s2{--tlo-p:rgba(28,30,29,.72);--tlo-p2:rgba(44,47,46,.84);--ram:rgba(255,255,255,.18);
 --nag:rgba(20,22,21,.8);--przyc:rgba(60,64,62,.9);--przyc-h:rgba(84,89,86,.95);--akc:#d6bd8a}
/* 3 zielen uczelni */
.s3{--tlo-p:rgba(3,103,68,.80);--tlo-p2:rgba(2,74,49,.9);--ram:rgba(232,214,176,.5);
 --nag:rgba(2,74,49,.88);--przyc:rgba(2,60,40,.9);--przyc-h:rgba(3,90,60,.95);
 --txt2:#c9e3d7;--akc:#e8d6b0;--lin:rgba(232,214,176,.28)}
/* 4 mleczne szklo */
.s4{--tlo-p:rgba(255,255,255,.80);--tlo-p2:rgba(255,255,255,.92);--ram:rgba(3,103,68,.28);
 --txt:#0f2b23;--txt2:#4a6a5f;--nag:rgba(255,255,255,.88);--akc:#7a6129;
 --przyc:rgba(3,103,68,.92);--przyc-h:rgba(2,74,49,.96);--lin:rgba(15,43,35,.14);
 --ok:#10653a;--alm:#a3231b;--uwg:#8a5e07;--mgla:rgba(240,246,243,.28)}
/* 5 papier */
.s5{--tlo-p:#ffffff;--tlo-p2:#f6f7f4;--ram:#d8d6cf;--txt:#1a1a18;--txt2:#5a5a54;
 --nag:#ffffff;--akc:#7a6129;--przyc:#ffffff;--przyc-h:#f0efe9;--blur:0px;--r:3px;
 --lin:#e6e4dd;--ok:#0d5730;--alm:#8c1d16;--uwg:#7a5300;--mgla:rgba(250,250,247,.9);
 --zloty:#036744;--zloty-t:#ffffff}
/* 7 pergamin */
.s7{--tlo-p:rgba(247,242,230,.9);--tlo-p2:rgba(252,249,240,.96);--ram:rgba(122,97,41,.34);
 --txt:#3a3122;--txt2:#6e6250;--nag:rgba(244,238,224,.94);--akc:#7a6129;
 --przyc:rgba(255,253,247,.95);--przyc-h:rgba(240,234,218,.98);--blur:4px;--r:6px;
 --lin:rgba(122,97,41,.2);--ok:#3f6b2e;--alm:#8c3a16;--uwg:#8a6a12;
 --mgla:rgba(248,243,231,.55);--zloty:#7a6129;--zloty-t:#fff}
/* 8 stal */
.s8{--tlo-p:rgba(226,232,236,.9);--tlo-p2:rgba(240,244,247,.96);--ram:rgba(70,90,105,.3);
 --txt:#16232c;--txt2:#4a606f;--nag:rgba(38,53,64,.94);--akc:#8aa2b4;
 --przyc:rgba(255,255,255,.95);--przyc-h:rgba(226,235,241,.98);--blur:6px;--r:4px;
 --lin:rgba(22,35,44,.14);--ok:#0f6b46;--alm:#a32a20;--uwg:#8a6206;
 --mgla:rgba(230,236,240,.5);--zloty:#26535f;--zloty-t:#fff}
/* 9 noc */
.s9{--tlo-p:rgba(10,14,24,.82);--tlo-p2:rgba(18,24,38,.92);--ram:rgba(120,150,210,.3);
 --nag:rgba(8,11,20,.9);--akc:#8fb0e8;--txt:#e8eef8;--txt2:#9fb0c8;--blur:12px;--r:10px;
 --przyc:rgba(30,42,68,.9);--przyc-h:rgba(46,62,96,.95);--lin:rgba(140,170,220,.18);
 --ok:#4fd6a8;--alm:#ff8ea0;--uwg:#f0c669;--zloty:linear-gradient(180deg,#9fc0ee,#5b7fb8);
 --zloty-t:#0a1220}
/* 10 zielen jasna — barwy uczelni na bieli */
.s10{--tlo-p:rgba(255,255,255,.94);--tlo-p2:rgba(238,245,242,.97);--ram:rgba(3,103,68,.32);
 --txt:#0f2b23;--txt2:#41645a;--nag:rgba(3,103,68,.96);--akc:#7a6129;
 --przyc:rgba(255,255,255,.96);--przyc-h:rgba(222,236,230,.98);--blur:6px;--r:8px;
 --lin:rgba(3,103,68,.16);--ok:#10653a;--alm:#a3231b;--uwg:#8a5e07;
 --mgla:rgba(246,250,248,.42);--zloty:#036744;--zloty-t:#fff}
.s10 .nag b{color:#e8d6b0}.s10 .nag span,.s10 .nag .pr{color:#c6ddd3}
.s10 .nag .pr b{color:#fff}
.s10 .zakl{background:rgba(2,74,49,.96)}
.s10 .zakl button{color:#c6ddd3}.s10 .zakl button.akt{color:#fff}
.s10 .stopka{background:rgba(3,103,68,.96);color:#c6ddd3}
/* 11 marmur — jasny kamien, uczelniana powaga */
.s11{--tlo-p:rgba(250,249,246,.93);--tlo-p2:rgba(255,255,255,.97);--ram:rgba(120,116,104,.3);
 --txt:#22201b;--txt2:#5c574c;--nag:rgba(38,42,38,.95);--akc:#8a7340;
 --przyc:rgba(255,255,255,.96);--przyc-h:rgba(238,236,229,.98);--blur:5px;--r:5px;
 --lin:rgba(34,32,27,.13);--ok:#2f6b41;--alm:#9c2b20;--uwg:#8a6a12;
 --mgla:rgba(250,249,246,.5);--zloty:#8a7340;--zloty-t:#fff}
.s11 .nag b{color:#e0cf9f}.s11 .nag span,.s11 .nag .pr{color:#c8ccc4}
.s11 .nag .pr b{color:#fff}
.s11 .zakl{background:rgba(30,34,30,.95)}.s11 .zakl button{color:#c8ccc4}
.s11 .zakl button.akt{color:#fff}
.s11 .stopka{background:rgba(38,42,38,.95);color:#c8ccc4}
/* 12 zloto na czerni — galowo */
.s12{--tlo-p:rgba(12,11,9,.86);--tlo-p2:rgba(24,21,15,.94);--ram:rgba(201,168,110,.5);
 --nag:rgba(8,7,6,.94);--akc:#d8b871;--txt:#f4efe3;--txt2:#bdb098;--blur:10px;--r:6px;
 --przyc:rgba(46,40,28,.92);--przyc-h:rgba(70,60,42,.96);--lin:rgba(201,168,110,.24);
 --ok:#7ed6a0;--alm:#ff9a8e;--uwg:#e8c46a;
 --zloty:linear-gradient(180deg,#f0dcae,#b8965a);--zloty-t:#241f10}
/* 6 kontrast */
.s6{--tlo-p:rgba(0,0,0,.78);--tlo-p2:rgba(12,12,12,.9);--ram:rgba(255,214,0,.5);
 --nag:rgba(0,0,0,.86);--akc:#ffd600;--txt:#ffffff;--txt2:#cfcfcf;--blur:6px;--r:4px;
 --przyc:rgba(30,30,30,.95);--przyc-h:rgba(60,60,60,.98);--lin:rgba(255,255,255,.22);
 --ok:#00e676;--alm:#ff5252;--uwg:#ffd600;--zloty:#ffd600;--zloty-t:#111}

.fot{position:absolute;inset:0;background:center 52%/cover no-repeat;
 transform:scale(1);transition:transform 1.1s cubic-bezier(.4,0,.2,1),filter .8s}
.okno.wszedl .fot{transform:scale(1.08);filter:saturate(.88)}
.mgla{position:absolute;inset:0;background:var(--mgla);transition:background .7s}
.okno.wszedl .mgla{background:rgba(2,14,9,.3)}
.s4.wszedl .mgla,.s5.wszedl .mgla{background:rgba(255,255,255,.5)}
.tresc{position:relative;z-index:2;min-height:41rem;display:flex;flex-direction:column}
.okno>.tresc{isolation:isolate}
.nag{position:relative;display:flex;align-items:center;gap:1rem;padding:.85rem 1.3rem;
 background:var(--nag);
 backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--ram)}
.nag img{width:2.5rem;height:2.5rem}
.nag b{display:block;font-size:.88rem;font-weight:600;color:var(--akc);letter-spacing:.03em}
.nag span{font-size:.76rem;color:var(--txt2)}
.nag .pr{margin-left:auto;text-align:right;font-size:.74rem;color:var(--txt2)}
.nag .pr b{font-size:1.25rem;color:var(--txt);font-variant-numeric:tabular-nums}
.zakl{display:flex;gap:1px;padding:0 1.3rem;background:var(--nag);opacity:.94;
 backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--ram)}
.zakl button{min-height:44px;background:none;border:0;color:var(--txt2);font:600 .84rem/1 inherit;
 padding:0 1rem;cursor:pointer;border-bottom:3px solid transparent;transition:.14s}
.zakl button:hover{color:var(--txt);background:rgba(127,127,127,.12)}
.zakl button.akt{color:var(--txt);border-bottom-color:var(--akc)}
main{flex:1;padding:1.3rem;display:flex;flex-direction:column;gap:1.1rem}
h2{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--akc);font-weight:600}
.szk{background:var(--tlo-p);backdrop-filter:blur(var(--blur));border:1px solid var(--ram);
 border-radius:var(--r)}
.kafle{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.kaf{padding:1.15rem;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.kaf:hover{background:var(--tlo-p2);transform:translateY(-3px);border-color:var(--akc)}
.kaf .pasek{position:absolute;left:0;top:0;bottom:0;width:4px;transition:.18s}
.kaf:hover .pasek{width:6px}
.kaf h3{font-size:1.2rem;font-weight:600;margin-left:.4rem}
.kaf .msc{font-size:.78rem;color:var(--txt2);margin-left:.4rem}
.kaf .st{display:inline-flex;align-items:center;gap:.45rem;margin:.65rem 0 0 .4rem;
 font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kr{width:.5rem;height:.5rem;border-radius:50%;box-shadow:0 0 9px currentColor}
.puls{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.42}}
.kaf .licz{display:flex;gap:1.1rem;margin:.85rem 0 0 .4rem;padding-top:.75rem;
 border-top:1px solid var(--lin);font-size:.72rem;color:var(--txt2)}
.kaf .licz b{display:block;font-size:1.1rem;color:var(--txt);font-variant-numeric:tabular-nums}
.kaf .otw{position:absolute;right:1rem;bottom:1rem;font-size:.78rem;color:var(--akc);opacity:0;
 transform:translateX(-6px);transition:.18s}
.kaf:hover .otw{opacity:1;transform:none}
.szcz{display:grid;grid-template-columns:1fr 19rem;gap:1.1rem;align-items:start;
 animation:wj .36s cubic-bezier(.2,.8,.2,1)}
@keyframes wj{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.wroc{display:flex;align-items:center;gap:1rem;padding:.65rem 1rem;margin-bottom:.9rem}
.wroc button{min-height:44px;padding:0 1rem;border:1px solid var(--ram);background:var(--tlo-p2);
 color:var(--txt);font:600 .84rem/1 inherit;border-radius:var(--r);cursor:pointer}
.wroc button:hover{border-color:var(--akc)}
.wroc .sc{font-size:.84rem;color:var(--txt2)}.wroc .sc b{color:var(--txt)}
.wyb:hover{border-color:var(--akc) !important}
/* Polaczenie przychodzace — to jest sedno tej aplikacji: kierowca dzwoni,
   dyzurny w dwie sekundy widzi kto i decyduje. */
.zgl{position:absolute;right:1.3rem;top:4.4rem;z-index:60;width:min(24rem,90%);
 background:var(--tlo-p2);backdrop-filter:blur(var(--blur));border:2px solid var(--uwg);
 border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden;
 animation:dzwon .4s cubic-bezier(.2,.9,.2,1)}
@keyframes dzwon{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
.zgl .pas{height:4px;background:var(--uwg);animation:odlicz 12s linear forwards}
@keyframes odlicz{from{width:100%}to{width:0%}}
.zgl .tresc2{padding:1rem 1.1rem}
.zgl .et2{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--uwg);
 font-weight:600;display:flex;align-items:center;gap:.5rem}
.zgl .et2 .kr{background:var(--uwg);color:var(--uwg)}
.zgl h4{font-size:1.25rem;font-weight:600;margin:.35rem 0 .1rem}
.zgl .nr{font-family:Consolas,monospace;font-size:1rem;color:var(--txt2)}
.zgl .rola{font-size:.8rem;color:var(--txt2);margin-top:.2rem}
.zgl .gdzie{font-size:.8rem;color:var(--txt2);margin-top:.5rem;padding-top:.5rem;
 border-top:1px solid var(--lin)}
.zgl .guziki{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.9rem}
.zgl .guziki button{min-height:46px;border:1px solid var(--ram);border-radius:var(--r);
 font:600 .88rem/1 inherit;cursor:pointer;transition:.14s}
.zgl .wpusc{background:var(--zloty);color:var(--zloty-t)}
.zgl .odmow{background:transparent;color:var(--alm);border-color:var(--alm)}
.zgl .guziki button:hover{filter:brightness(1.12)}
/* licznik zdarzen na zywo */
.nowy{animation:podswietl 1.6s ease-out}
@keyframes podswietl{from{background:rgba(240,192,105,.28)}to{background:transparent}}
/* szybki wybor wygladu — dostepny z kazdego ekranu */
.wyglad{margin-left:auto;min-height:40px;padding:0 1rem;border:1px solid var(--ram);
 border-radius:var(--r);background:var(--tlo-p2);color:var(--txt);font:600 .82rem/1 inherit;
 cursor:pointer;transition:.14s}
.wyglad:hover{border-color:var(--akc)}
.nag .pr{margin-left:1rem}
.menuW{position:absolute;right:1.3rem;top:4.2rem;z-index:40;width:min(38rem,92%);
 background:var(--tlo-p2);backdrop-filter:blur(var(--blur));border:1px solid var(--akc);
 border-radius:var(--r);box-shadow:0 20px 48px rgba(0,0,0,.5);padding:1rem;
 animation:zjazd .22s ease-out}
@keyframes zjazd{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.menuW h3{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--akc);
 margin:.2rem 0 .5rem}
.menuW .siatkaW{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;margin-bottom:.8rem}
.menuW .siatkaW button{min-height:40px;padding:0 .5rem;border:1px solid var(--ram);
 border-radius:var(--r);background:transparent;color:var(--txt);font:600 .76rem/1.2 inherit;
 cursor:pointer;transition:.14s}
.menuW .siatkaW button:hover{border-color:var(--akc)}
.menuW .siatkaW button.akt{background:var(--przyc);border-color:var(--akc)}
.menuW .zamknij{width:100%;min-height:40px;border:1px solid var(--ram);border-radius:var(--r);
 background:transparent;color:var(--txt2);font:600 .8rem/1 inherit;cursor:pointer}
.wroc .x{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;font-size:1.05rem}
.scena{height:18rem;border-radius:var(--r);position:relative;overflow:hidden;
 border:1px solid var(--ram);background:rgba(0,0,0,.22)}
.s4 .scena,.s5 .scena{background:rgba(0,0,0,.10)}
.grunt{position:absolute;left:0;right:0;bottom:3.2rem;height:.65rem;background:rgba(150,164,156,.85)}
/* Pojazd przejezdzajacy przez brame — wjezdza z lewej, zatrzymuje sie
   przed zapora, po otwarciu przejezdza i znika po prawej. */
.auto{position:absolute;bottom:3.5rem;width:5.2rem;height:2.1rem;left:-7rem;
 transition:left 1.4s cubic-bezier(.35,0,.3,1)}
.auto .nadwozie{position:absolute;inset:0;background:#3f5c74;border-radius:.5rem .9rem .3rem .3rem;
 box-shadow:0 .2rem .4rem rgba(0,0,0,.35)}
.auto .szyba{position:absolute;left:1.4rem;top:.28rem;width:2.4rem;height:.72rem;
 background:#9fc4dd;border-radius:.25rem}
.auto .kolo{position:absolute;bottom:-.32rem;width:.85rem;height:.85rem;border-radius:50%;
 background:#1d2529;border:.16rem solid #6d7d88}
.auto .k1{left:.7rem}.auto .k2{right:.7rem}
.auto.czeka{left:22%}.auto.jedzie{left:105%}
.auto .swiatlo{position:absolute;right:.15rem;top:.85rem;width:.35rem;height:.3rem;
 border-radius:.1rem;background:#ffe9a8;box-shadow:0 0 .5rem #ffe07a}
.slup{position:absolute;bottom:3.85rem;width:1.3rem;border-radius:.2rem .2rem 0 0;
 background:linear-gradient(180deg,#e2e9e6,#7d8a83);transition:height .95s cubic-bezier(.4,0,.2,1)}
.belka{position:absolute;left:12%;bottom:3.85rem;width:58%;height:.65rem;
 background:repeating-linear-gradient(90deg,#f0f4f2 0 1.7rem,#c0392b 1.7rem 3.4rem);
 transform-origin:left center;transition:transform 1.05s cubic-bezier(.4,0,.2,1)}
.wiersz{display:flex;justify-content:space-between;padding:.65rem 0;border-bottom:1px solid var(--lin);
 font-size:.84rem;color:var(--txt2)}
.wiersz:last-child{border:0}.wiersz b{color:var(--txt);font-variant-numeric:tabular-nums}
.btn{min-height:46px;width:100%;border:1px solid var(--ram);border-radius:var(--r);
 background:var(--przyc);color:var(--txt);font:600 .87rem/1 inherit;cursor:pointer;
 margin-bottom:.45rem;transition:.14s}
.btn:hover{background:var(--przyc-h);transform:translateY(-1px)}
.btn.zlo{background:var(--zloty);color:var(--zloty-t)}
.btn.dan{color:var(--alm)}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--akc);
 padding:0 .55rem .45rem;font-weight:600}
td{padding:.55rem;border-top:1px solid var(--lin)}
tbody tr:hover td{background:rgba(127,127,127,.1)}
.stopka{padding:.65rem 1.3rem;background:var(--nag);backdrop-filter:blur(var(--blur));
 border-top:1px solid var(--ram);display:flex;gap:1.3rem;font-size:.76rem;color:var(--txt2)}
.opis{width:min(1480px,100%);background:rgba(4,26,17,.9);border:1px solid rgba(232,214,176,.28);
 border-left:4px solid #c9a86e;border-radius:8px;padding:.9rem 1.1rem;font-size:.86rem;color:#c6ddd3}
.opis b{color:#fff}

/* ================= UKŁADY ================= */
.u2 .kafle{grid-template-columns:1fr}
.u2 main{display:grid;grid-template-columns:16rem 1fr;gap:1.1rem;align-content:start}
.u2 .kaf .licz{display:none}
.u3 .kafle{grid-template-columns:1fr;gap:.6rem}
.u3 .kaf{display:grid;grid-template-columns:1fr 11rem 7rem 7rem;gap:1rem;align-items:center}
.u3 .kaf .st,.u3 .kaf .licz{margin:0;padding:0;border:0}
.u3 .kaf .otw{position:static;opacity:1;transform:none;text-align:right}
.u4 .kaf{text-align:center;padding:1.9rem 1.1rem}
.u4 .kaf .pasek{width:100%;height:4px;bottom:auto}
.u4 .kaf h3{font-size:1.55rem;margin:0}.u4 .kaf .msc{margin:0}
.u4 .kaf .st{margin:.9rem auto 0;font-size:.95rem}
.u4 .kaf .licz{justify-content:center;margin:.9rem 0 0}
.u4 .kaf .otw{position:static;opacity:1;transform:none;display:block;margin-top:.9rem}
.u5 .kafle{grid-template-columns:1fr;gap:0}
.u5 .kaf{border-radius:0;border-left:0;border-right:0;border-top:0;padding:1rem 1.1rem;

function ustawienia(){
 // Style jako lista z probka barw — widac, co sie wybiera, zanim sie kliknie.
 const PROBKI={11:["#faf9f6","#262a26","#8a7340"],12:["#0c0b09","#181510","#d8b871"],
  1:["#031c12","#036744","#c9a86e"],2:["#1c1e1d","#3c403e","#d6bd8a"],
  3:["#036744","#024a31","#e8d6b0"],4:["#ffffff","#e6f0ec","#7a6129"],
  5:["#ffffff","#f6f7f4","#036744"],6:["#000000","#1e1e1e","#ffd600"],
  7:["#f7f2e6","#efe8d6","#7a6129"],8:["#e2e8ec","#263540","#26535f"],
  9:["#0a0e18","#1e2a44","#8fb0e8"],10:["#ffffff","#036744","#e8d6b0"]};
 const kartaWyb=(tyt,opisy,teraz,klucz)=>`<section class="szk" style="padding:1.1rem">
  <h2 style="margin-bottom:.8rem">${tyt}</h2>
  <div style="display:flex;flex-direction:column;gap:.4rem">
  ${Object.entries(opisy).map(([nr,op])=>`
   <button class="wyb" data-${klucz}="${nr}"
    style="display:flex;align-items:center;gap:1rem;text-align:left;padding:.8rem 1rem;
    border:1px solid ${+nr===teraz?"var(--akc)":"var(--ram)"};border-radius:var(--r);
    background:${+nr===teraz?"var(--tlo-p2)":"transparent"};color:var(--txt);cursor:pointer;
    font:inherit;min-height:auto;width:100%">
    ${klucz==="ws"?`<span style="display:flex;flex:none;border-radius:4px;overflow:hidden;
      border:1px solid var(--lin)">${PROBKI[nr].map(c=>
      `<i style="display:block;width:1.15rem;height:2.1rem;background:${c}"></i>`).join("")}</span>`
     :`<span style="flex:none;width:2.6rem;text-align:center;font-size:1.15rem;font-weight:600;
       color:var(--akc)">${nr}</span>`}
    <span style="flex:1;min-width:0">
     <b style="display:block;font-size:.95rem">${klucz==="wu"?"Układ":"Styl"} ${nr} · ${
      (klucz==="wu"?NAZWY_U:NAZWY_S)[nr]}</b>
     <span style="font-size:.8rem;color:var(--txt2);line-height:1.4">${op}</span></span>
    ${+nr===teraz?'<span style="color:var(--akc);font-size:1.1rem;flex:none">✓</span>':""}
   </button>`).join("")}
  </div></section>`;
 return `<section class="szk" style="padding:1.1rem">
   <h2 style="margin-bottom:.4rem">Wygląd programu</h2>
   <div style="font-size:.86rem;color:var(--txt2)">Wybierz układ i styl. Zmiana działa od razu
    i zapisuje się w bazie — każdy dyżurny może mieć swój.</div></section>
  ${kartaWyb("Układ elementów",OPU,uklad,"wu")}
  ${kartaWyb("Styl graficzny",OPS,styl,"ws")}`}
function wnetrze(){
 if(zakladka==="ust")return ustawienia();
 if(uklad===16){
  // Plan kampusu: obiekty stoja w miejscach odpowiadajacych rzeczywistemu
  // polozeniu. Pulsujaca fala pokazuje, ktory wlasnie dzwoni.
  const POZ=[[26,72],[70,40],[80,74]];
  return `<div class="plan">
   <div class="droga" style="left:0;top:66%;right:0;height:9%"></div>
   <div class="droga" style="left:62%;top:0;width:7%;bottom:0"></div>
   <div class="budynek" style="left:6%;top:10%;width:34%;height:38%">Gmach główny</div>
   <div class="budynek" style="left:74%;top:10%;width:20%;height:26%">Hala</div>
   <div class="budynek" style="left:8%;top:82%;width:24%;height:14%">Dom studenta</div>
   ${OB.map((o,i)=>{const[t,k]=ST[o.s];const c=`var(--${k})`;
    const dzwoni=o.s==="dzwoni";
    return `<div class="pin" data-o="${i}" style="left:${POZ[i][0]}%;top:${POZ[i][1]}%">
     ${dzwoni?`<span class="fala" style="border-color:${c}"></span>`:""}
     <div class="bak" style="border-color:${c}">
      <span class="kr puls" style="background:${c};color:${c};width:.9rem;height:.9rem"></span></div>
     <div class="etyk">${o.n}</div><div class="st2" style="color:${c}">${t}</div></div>`}).join("")}
   ${otw!==null?`<div class="szk panelBok" style="padding:1.1rem">${szczegol()}</div>`:""}
  </div>`;
 }
 if(uklad===17){
  // Kiosk: jeden obiekt na caly ekran, przelaczany strzalkami albo kropkami.
  const i = otw===null ? kioskNr : otw;
  const o=OB[i],[t,k]=ST[o.s];
  return `<div style="position:relative">
   <div class="strzalki"><button data-kio="-1">‹</button><button data-kio="1">›</button></div>
   <div class="szk" style="padding:1.4rem">
    <div style="display:flex;align-items:center;gap:.8rem;margin-bottom:1rem">
     <span class="kr puls" style="background:var(--${k});color:var(--${k});width:.8rem;height:.8rem"></span>
     <b style="font-size:1.9rem">${o.n}</b>
     <span style="margin-left:auto;color:var(--${k});font-weight:600;letter-spacing:.05em;
      text-transform:uppercase">${t}</span></div>
    ${scena(o)}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin:1.1rem 0;
     text-align:center">
     <div><b style="display:block;font-size:1.7rem">${o.wj}</b>
      <span style="font-size:.76rem;color:var(--txt2)">wjazdów dziś</span></div>
     <div><b style="display:block;font-size:1.7rem">${o.ost}</b>
      <span style="font-size:.76rem;color:var(--txt2)">ostatni przejazd</span></div>
     <div><b style="display:block;font-size:1.7rem;color:var(--ok)">Łączy</b>
      <span style="font-size:.76rem;color:var(--txt2)">sterownik</span></div>
     <div><b style="display:block;font-size:1.7rem">124</b>
      <span style="font-size:.76rem;color:var(--txt2)">uprawnionych</span></div></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem">
     <button class="btn zlo" data-a="0">Wpuść pojazd</button>
     <button class="btn" data-a="1">Otwórz na stałe</button>
     <button class="btn" data-a="2">${o.t==="slupki"?"Zamknij":"Opuść"}</button>
     <button class="btn dan" data-a="3">Blokada</button></div>
   </div>
   <div class="kropki2">${OB.map((_,j)=>
    `<i class="${j===i?"akt":""}" data-kio2="${j}"></i>`).join("")}</div></div>`;
 }
 if(TLO_NAJPIERW.includes(uklad)){
  // Uklady „tlo najpierw": okno zostaje puste, widac kampus. Obiekty leza
  // zwiniete jak przyciski i rozwijaja sie dopiero po kliknieciu.
  const plyta = otw===null
   ? `<div class="plyta"><div class="plakat"><b>AWF KIEROWCY</b>
      <span>Kliknij obiekt, żeby go otworzyć</span></div></div>`
   : `<div class="rozwin">${szczegol()}</div>`;
  const dok = `<div class="dok">${OB.map(kafel).join("")}</div>`;
  return uklad===11 ? dok+plyta : plyta+dok;
 }
 if(otw!==null)return szczegol();
 return `<section><h2 style="margin-bottom:.7rem">Obiekty</h2>
  <div class="kafle">${OB.map(kafel).join("")}</div></section>
 <section class="szk" style="padding:1.1rem"><h2 style="margin-bottom:.7rem">Ostatnie zdarzenia</h2>
  <table><thead><tr><th>Godzina</th><th>Obiekt</th><th>Kierowca</th><th>Zdarzenie</th></tr></thead>
  <tbody>${HIST.map((h,ix)=>`<tr class="${ix===0?"nowy":""}"><td>${h[0]}</td><td>${h[1]}</td><td>${h[2]}</td><td>${h[3]}</td></tr>`).join("")}</tbody>
  </table></section>`}
function rysuj(){
 document.getElementById("rama").innerHTML=`<div class="okno u${uklad} s${styl} ${TLO_NAJPIERW.includes(uklad)?"uT":""} ${
   otw!==null?"wszedl":""}">
  <div class="fot" style="background-image:url('${FOTO}')"></div><div class="mgla"></div>
  <div class="tresc"><div class="nag"><img src="${GODLO}" alt="godło">
    <div><b>AKADEMIA WYCHOWANIA FIZYCZNEGO JÓZEFA PIŁSUDSKIEGO W WARSZAWIE</b>
     <span>Straż Akademicka · Kontrola wjazdu i wyjazdu</span></div>
    <button class="wyglad" id="wyglad" title="Zmień wygląd">Wygląd</button>
    <div class="pr"><b class="zg">${czas()}</b>2 sierpnia 2026 · J. Kowalski</div></div>
   ${menuWygladu?menuWyglad():""}${oknoZgl()}
   <div class="zakl">${[["ob","Obiekty"],["ki","Kierowcy"],["hi","Historia"],
     ["ra","Raporty"],["ust","Ustawienia"]]
    .map(([k,z])=>`<button class="${k===zakladka?"akt":""}" data-z="${k}">${z}</button>`).join("")}</div>
   <main>${wnetrze()}</main>
   <div class="stopka"><span>Marymoncka 34, 00-968 Warszawa · 22 834 04 31</span>
    <span style="margin-left:auto">AWF KIEROWCY 8.0.0</span></div></div></div>`;
 document.querySelectorAll("[data-kio]").forEach(b=>b.onclick=()=>{
  kioskNr=(kioskNr+ +b.dataset.kio+OB.length)%OB.length; otw=null; rysuj()});
 document.querySelectorAll("[data-kio2]").forEach(b=>b.onclick=()=>{
  kioskNr=+b.dataset.kio2; otw=null; rysuj()});
 const zt=document.getElementById("zglTak"), zn=document.getElementById("zglNie");
 if(zt)zt.onclick=()=>odpowiedz(true);
 if(zn)zn.onclick=()=>odpowiedz(false);
 const bw=document.getElementById("wyglad");
 if(bw)bw.onclick=()=>{menuWygladu=!menuWygladu;rysuj()};
 const zw=document.getElementById("zamknijW");
 if(zw)zw.onclick=()=>{menuWygladu=false;rysuj()};
 document.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{
  zakladka=b.dataset.z; otw=null; rysuj()});
 document.querySelectorAll("[data-wu]").forEach(b=>b.onclick=()=>{uklad=+b.dataset.wu;
  document.querySelectorAll("#gora button[data-u]").forEach(
   x=>x.classList.toggle("akt",+x.dataset.u===uklad)); rysuj()});
 document.querySelectorAll("[data-ws]").forEach(b=>b.onclick=()=>{styl=+b.dataset.ws;
  document.querySelectorAll("#gora button[data-s]").forEach(
   x=>x.classList.toggle("akt",+x.dataset.s===styl)); rysuj()});
 document.querySelectorAll("[data-o]").forEach(k=>k.onclick=e=>{
  if(e.target.closest("[data-a]"))return;
  const n=+k.dataset.o;
  otw = (otw===n) ? null : n;      // drugie klikniecie zwija
  rysuj()});
 document.querySelectorAll("#wroc,#zamk").forEach(b=>b.onclick=()=>{otw=null;rysuj()});
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=e=>{e.stopPropagation();
  const a=b.dataset.a, i=(otw!==null?otw:(uklad===17?kioskNr:0));
  if(a==="0")przejazd(i);else if(a==="1"){OB[i].s="stale";rysuj()}
  else if(a==="2"){OB[i].s="zam";rysuj()}
  else{OB[i].s=OB[i].s==="blok"?"zam":"blok";rysuj()}});
 document.getElementById("opis").innerHTML=
  `<b>Układ ${uklad}:</b> ${OPU[uklad]}. &nbsp;·&nbsp; <b>Styl ${styl}:</b> ${OPS[styl]}.
   <span style="color:#8fae9f"> — 17 układów × 12 stylów = 204 kombinacje.</span>`}
/* ---------- zycie aplikacji ---------- */
let zgloszenie=null, zegarZgl=null;

function terazHHMM(){return new Date().toLocaleTimeString("pl-PL",
 {hour:"2-digit",minute:"2-digit"})}
function wpis(obiekt,kto,co){HIST.unshift([terazHHMM(),obiekt,kto,co]);
 if(HIST.length>7)HIST.pop()}

function przejazd(i){
 // Pelny cykl: otwieranie -> przejazd -> zamykanie -> spoczynek.
 // Kazdy etap ma swoj stan, wiec plakietka i scena zmieniaja sie po kolei.
 const o=OB[i];
 o.s="otwieranie"; rysuj();
 setTimeout(()=>{o.s="otw"; rysuj();
  setTimeout(()=>{o.s="zamykanie"; o.wj++; o.ost=terazHHMM();
   wpis(o.n,o.kto||"—","wjazd"); rysuj();
   setTimeout(()=>{o.s="zam"; rysuj()},1400);
  },2200);
 },1200);
}

function nowe_zgloszenie(){
 if(zgloszenie||otw!==null&&false)return;
 const i=Math.floor(Math.random()*OB.length);
 if(OB[i].s!=="zam")return;                     // dzwonia tylko na zamkniete
 const k=KIEROWCY[Math.floor(Math.random()*KIEROWCY.length)];
 zgloszenie={ob:i,kto:k[0],nr:k[1],rola:k[2],znany:k[2]!=="brak w bazie"};
 OB[i].s="dzwoni"; OB[i].kto=k[0];
 rysuj();
 clearTimeout(zegarZgl);
 zegarZgl=setTimeout(()=>{                       // nikt nie odebral
  if(!zgloszenie)return;
  const j=zgloszenie.ob; OB[j].s="zam";
  wpis(OB[j].n,zgloszenie.kto,"brak odpowiedzi");
  zgloszenie=null; rysuj();
 },12000);
}
function odpowiedz(tak){
 if(!zgloszenie)return;
 const i=zgloszenie.ob, kto=zgloszenie.kto;
 clearTimeout(zegarZgl);
 if(tak){zgloszenie=null; OB[i].kto=kto; przejazd(i);}
 else{OB[i].s="odmowa"; wpis(OB[i].n,kto,"odmowa wjazdu"); zgloszenie=null; rysuj();
  setTimeout(()=>{OB[i].s="zam"; rysuj()},2200);}
}
function oknoZgl(){
 if(!zgloszenie)return "";
 const o=OB[zgloszenie.ob];
 return `<div class="zgl"><div class="pas"></div><div class="tresc2">
  <div class="et2"><span class="kr puls"></span>Połączenie przychodzące</div>
  <h4>${zgloszenie.kto}</h4><div class="nr">${zgloszenie.nr}</div>
  <div class="rola">${zgloszenie.znany?zgloszenie.rola:"⚠ numer nie figuruje w bazie"}</div>
  <div class="gdzie">${o.n} · ${o.m}</div>
  <div class="guziki"><button class="wpusc" id="zglTak">Wpuść</button>
   <button class="odmow" id="zglNie">Odmów</button></div>
 </div></div>`}
document.querySelectorAll("#gora button[data-u]").forEach(b=>b.onclick=()=>{uklad=+b.dataset.u;otw=null;
 document.querySelectorAll("#gora button[data-u]").forEach(x=>x.classList.toggle("akt",x===b));rysuj()});
document.querySelectorAll("#gora button[data-s]").forEach(b=>b.onclick=()=>{styl=+b.dataset.s;otw=null;
 document.querySelectorAll("#gora button[data-s]").forEach(x=>x.classList.toggle("akt",x===b));rysuj()});
document.getElementById("ruch").onclick=()=>przejazd(otw===null?0:otw);
document.getElementById("zgl").onclick=()=>nowe_zgloszenie();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&otw!==null){otw=null;rysuj()}});
setInterval(()=>document.querySelectorAll(".zg").forEach(z=>z.textContent=czas()),1000);
// Zgloszenia przychodza same — tak wyglada dyzur: czekasz i reagujesz.
function nastepne(){setTimeout(()=>{nowe_zgloszenie();nastepne()},9000+Math.random()*7000)}
nastepne();
rysuj();
</script></html>
